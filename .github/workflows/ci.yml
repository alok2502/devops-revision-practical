name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:

defaults:
  run:
    working-directory: 07-cicd/day21-github-actions

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # 1. clone the repo onto the runner
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 3. install dependencies
      - name: Install dependencies
        run: pip install -r requirements.txt

      # 4. LINT stage
      - name: Lint
        run: pip install flake8 && flake8 app.py --max-line-length=100 || true

      # 5. TEST stage
      - name: Run tests
        run: pytest -v

      # log in to GHCR using the built-in token (NO hardcoded creds)
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # build AND push, tagged with commit SHA + latest
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: 07-cicd/day21-github-actions
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/myapp:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/myapp:latest


      - name: Scan pushed image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/myapp:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '0'
          ignore-unfixed: true
